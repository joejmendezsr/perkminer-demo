{% extends "pm_public_base.html" %}
{% block title %}Testimonial - Perk Miner{% endblock %}

{% block content %}
<div class="pp-wrap wide">

  <div class="card pm-hero">
    <div class="pm-hero-icon"><i class="bi bi-camera-video"></i></div>
    <div class="pm-hero-body">
      <div class="pm-hero-sub">Video testimonial</div>
      <h1>Testimonial</h1>
    </div>
    <div class="pm-hero-actions">
      <a href="{{ url_for('testimonials_members') }}" class="btn btn-sm btn-end"><i class="bi bi-arrow-left"></i> Back to testimonials</a>
    </div>
  </div>

  <div id="testimonial-detail">
    <div class="card pm-empty">Loading testimonial...</div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', async function () {
  const id = {{ testimonial_id }};
  const container = document.getElementById('testimonial-detail');

  // your Cloudinary cloud name
  const cloudName = "dmrntlcfd";

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  try {
    // main testimonial
    const resp = await fetch(`/api/testimonials/${id}`);
    if (!resp.ok) {
      container.innerHTML = "<div class='pm-note bad'>Testimonial not found.</div>";
      return;
    }
    const tv = await resp.json();

    // other videos by same owner
    const othersResp = await fetch(`/api/testimonials/${id}/others`);
    const othersData = await othersResp.json();

    const name = tv.owner_type === 'member'
      ? (tv.owner_name || 'Member')
      : (tv.business_name || 'Business');

    // build transformed Cloudinary URL from public_id
    const publicId = tv.cloudinary_public_id;
    // transformation: 720p-ish, compressed MP4 (H.264), auto quality
    const transformedUrl =
      `https://res.cloudinary.com/${cloudName}/video/upload/` +
      `q_auto:good,vc_h264,br_1000k,ac_aac,ar_44100,f_mp4/${publicId}.mp4`;

    let html = `
      <div class="card p-3">
        <div class="card-title-row"><i class="bi bi-person-circle"></i><h5>${esc(name)}</h5></div>
        <div class="mb-2">
          <span class="pm-status pm-status-info">Level: ${esc(tv.level_code)}</span>
          <span class="pm-status pm-status-neutral ms-1">Amount at submission: $${esc(tv.lifetime_amount_at_submission)}</span>
        </div>
        <div class="ratio ratio-16x9">
          <video controls src="${transformedUrl}" style="width: 100%; height: 100%; border-radius: 12px; background:#000;"></video>
        </div>
      </div>
    `;

    // other videos section
    if (othersData.items && othersData.items.length > 0) {
      html += `
        <div class="card p-3">
          <div class="card-title-row">
            <i class="bi bi-collection-play"></i>
            <h5>Other videos by this ${tv.owner_type === 'member' ? 'member' : 'business'}</h5>
          </div>
          <ul class="pp-list">
      `;
      othersData.items.forEach(o => {
        html += `
            <li><a href="/testimonials/${encodeURIComponent(o.id)}">${esc(o.level_code)} – $${esc(o.lifetime_amount_at_submission)}</a></li>
        `;
      });
      html += `
          </ul>
        </div>
      `;
    }

    container.innerHTML = html;
  } catch (e) {
    console.error("Error loading testimonial detail:", e);
    container.innerHTML = "<div class='pm-note bad'>Failed to load testimonial.</div>";
  }
});
</script>
{% endblock %}
