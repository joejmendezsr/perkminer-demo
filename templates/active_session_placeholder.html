{% extends "pm_base.html" %}
{% block title %}Active Session – PerkMiner{% endblock %}

{% block content %}
<div class="container pb-3" style="max-width: 640px;">
  <div class="card pm-hero mb-3">
    <div class="pm-hero-icon"><i class="bi bi-shop"></i></div>
    <div class="pm-hero-body">
      <div class="pm-hero-sub">Active session with</div>
      <h1>{{ interaction.business.business_name }}</h1>
    </div>
  </div>

  <div class="card p-4">
    <div class="pm-note text-center mb-3"><i class="bi bi-hourglass-split"></i> Messaging functionality coming soon!</div>
    <div class="d-flex flex-wrap gap-2">
      <button class="btn btn-success flex-grow-1"><i class="bi bi-check2-circle"></i> Finalize Transaction</button>
      <button class="btn btn-danger flex-grow-1"><i class="bi bi-x-octagon"></i> End Session</button>
    </div>
    <a href="{{ url_for('user_biz_interactions') }}" class="btn btn-outline-secondary mt-3 w-100"><i class="bi bi-arrow-left"></i> Back</a>
  </div>
</div>
{% endblock %}
