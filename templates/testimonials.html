{% extends "base.html" %}

{% block content %}
<div class="container my-4">

  <!-- header + description + back button -->
  <div class="d-flex flex-column flex-md-row align-items-md-center justify-content-between mb-3">
    <div class="mb-2 mb-md-0">
      <h2 class="mb-1">Testimonials</h2>
      <p class="text-muted mb-0">
        Only members with $10,000+ in lifetime earnings and businesses with $25,000+ in sales
        can appear here.
      </p>
    </div>
    <div class="mt-2 mt-md-0">
      <a href="{{ url_for('home') }}" class="btn btn-outline-secondary btn-sm">
        ← Back to Home
      </a>
    </div>
  </div>

  <!-- tabs -->
  <ul class="nav nav-tabs mb-3">
    <li class="nav-item">
      <a class="nav-link {% if initial_owner_type == 'member' %}active{% endif %}"
         href="{{ url_for('testimonials_members') }}">
        Members
      </a>
    </li>
    <li class="nav-item">
      <a class="nav-link {% if initial_owner_type == 'business' %}active{% endif %}"
         href="{{ url_for('testimonials_businesses') }}">
        Businesses
      </a>
    </li>
  </ul>

  <!-- grid container -->
  <div id="testimonials-grid">
    <p class="text-muted">Loading testimonials...</p>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
  const ownerType = "{{ initial_owner_type }}";
  const grid = document.getElementById('testimonials-grid');

  async function loadTestimonials(page = 1) {
    try {
      const resp = await fetch(`/api/testimonials/public?owner_type=${ownerType}&page=${page}`);
      const data = await resp.json();

      grid.innerHTML = "";

      if (!data.items || data.items.length === 0) {
        grid.innerHTML = "<p class='text-muted mb-0'>No testimonials yet.</p>";
        return;
      }

      const row = document.createElement('div');
      row.className = "row";

      data.items.forEach(item => {
        const col = document.createElement('div');
        col.className = "col-12 col-md-6 col-lg-4 mb-3";

        const name = item.owner_type === 'member'
          ? (item.owner_name || 'Member')
          : (item.business_name || 'Business');

        col.innerHTML = `
          <div class="card h-100 shadow-sm">
            <div class="card-body d-flex flex-column">
              <h6 class="card-title mb-1">${name}</h6>
              <p class="card-text mb-1 small text-muted">
                <strong>Level:</strong> ${item.level_code}
              </p>
              <p class="card-text mb-2 small text-muted">
                <strong>Amount at submission:</strong>
                $${item.lifetime_amount_at_submission}
              </p>
              <a href="/testimonials/${item.id}" class="btn btn-sm btn-primary mt-auto align-self-start">
                View video
              </a>
            </div>
          </div>
        `;
        row.appendChild(col);
      });

      grid.appendChild(row);
    } catch (e) {
      console.error("Error loading testimonials:", e);
      grid.innerHTML = "<p class='text-danger mb-0'>Failed to load testimonials.</p>";
    }
  }

  loadTestimonials();
});
</script>
{% endblock %}
