<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Contact - {{ business.business_name }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    {{ business.contact_css | safe }}
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles/pm-theme.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='styles/pm-checks.css') }}">
</head>
<body>
<div class="container py-4">
  <h2 class="mb-4 text-center">Contact {{ business.business_name }}</h2>
  <nav class="mb-4 text-center">
    <a href="{{ url_for('public_storefront', store_slug=business.store_slug) }}" class="btn btn-outline-secondary btn-sm mx-1">Home</a>
    <a href="{{ url_for('public_store_products', store_slug=business.store_slug) }}" class="btn btn-outline-primary btn-sm mx-1">Products</a>
    <a href="{{ url_for('public_store_cart', store_slug=business.store_slug) }}" class="btn btn-outline-success btn-sm mx-1">Cart</a>
  </nav>
  <div>
    {{ contact_html | safe }}
  </div>
</div>
</body>
</html>
