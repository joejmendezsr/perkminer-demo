<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - Server Error</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles/pm-theme.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='styles/pm-checks.css') }}">
</head>
<body class="bg-light">
    <div class="container text-center mt-5">
        <h1 class="display-1 text-danger">500</h1>
        <h2>Oops! Internal Server Error</h2>
        <p class="lead mt-4">{{ error_message }}</p>
        <p>Our team has been notified. Please try again later or <a href="{{ url_for('home') }}">go back to homepage</a>.</p>
    </div>
</body>
</html>
